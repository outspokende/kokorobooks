name: KokoroBooks
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"          # language mode 5: relaxed concurrency checking
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad

targets:
  KokoroBooks:
    type: application
    platform: iOS
    sources:
      - path: AudiobookApp
    settings:
      base:
        # Replace with an identifier owned by your Apple Developer account.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kokorobooks
        PRODUCT_NAME: KokoroBooks
        INFOPLIST_KEY_CFBundleDisplayName: KokoroBooks
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AudiobookApp/Info.plist
      properties:
        CFBundleDisplayName: KokoroBooks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]      # keep playing with the screen locked
        # The server is reached over Tailscale via plain HTTP, so allow it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Connect to your audiobook server on your private network."
        # App Store Connect: the app uses no non-exempt encryption, so uploads
        # do not stop for an export-compliance questionnaire.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.books
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # App Store Connect rejects an iPad build that does not support every
        # orientation (or declare full screen), so iPad rotates freely while
        # the iPhone stays portrait.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Drives the app in a simulator to capture App Store screenshots.
  # Not part of a release build; see ios/screenshots.sh and docs/APP_STORE.md.
  KokoroBooksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: KokoroBooks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kokorobooks.uitests
        TEST_TARGET_NAME: KokoroBooks

schemes:
  KokoroBooks:
    build:
      targets:
        KokoroBooks: all
        KokoroBooksUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KokoroBooksUITests
    archive:
      config: Release
